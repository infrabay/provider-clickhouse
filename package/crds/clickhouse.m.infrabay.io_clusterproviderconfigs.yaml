---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusterproviderconfigs.clickhouse.m.infrabay.io
spec:
  group: clickhouse.m.infrabay.io
  names:
    categories:
    - crossplane
    - provider
    - clickhouse
    kind: ClusterProviderConfig
    listKind: ClusterProviderConfigList
    plural: clusterproviderconfigs
    shortNames:
    - chcpc
    singular: clusterproviderconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.endpoint.host
      name: ENDPOINT
      type: string
    - jsonPath: .spec.credentials.source
      name: SOURCE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A ClusterProviderConfig configures how the provider connects to a ClickHouse
          server, and limits what managed resources may do through it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterProviderConfigSpec configures a ClusterProviderConfig.
            properties:
              allowInsecureTransport:
                default: false
                description: |-
                  AllowInsecureTransport permits a connection without TLS. The native
                  protocol then sends the provider's password or token in clear text. Only
                  for lab setups or traffic that is encrypted below ClickHouse.
                type: boolean
              cluster:
                description: |-
                  Cluster names a cluster from <remote_servers>. When set, Database DDL
                  uses ON CLUSTER <cluster>. Before every ON CLUSTER ALTER or DROP the
                  provider reads the database's UUID on every host of the cluster
                  (clusterAllReplicas, which needs the REMOTE privilege) and refuses the
                  write if any host has a database of that name with another UUID.
                  Deleting a Database then always needs forceDrop. The provider refuses
                  to write access entities unless they are stored in a replicated user
                  directory. Access entities never use ON CLUSTER.
                minLength: 1
                type: string
              credentials:
                description: Credentials of the provider identity.
                properties:
                  googleIDToken:
                    description: GoogleIDToken authenticates with a Google ID token.
                    properties:
                      audience:
                        description: |-
                          Audience requested in the ID token. It must equal expected_audience of
                          the server's token processor. Use a value unique to this ClickHouse
                          deployment, for example its URL.
                        minLength: 1
                        type: string
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef optionally selects a service account key JSON. When
                          omitted, Application Default Credentials are used: on GKE with Workload
                          Identity, the metadata server.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - audience
                    type: object
                  passwordSecret:
                    description: PasswordSecret authenticates with a user name and
                      a password.
                    properties:
                      passwordSecretRef:
                        description: PasswordSecretRef selects the password.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      username:
                        description: Username of the provider identity.
                        minLength: 1
                        type: string
                    required:
                    - passwordSecretRef
                    - username
                    type: object
                  source:
                    description: Source of the credentials.
                    enum:
                    - PasswordSecret
                    - TokenSecret
                    - GoogleIDToken
                    - TokenFile
                    type: string
                  tokenFile:
                    description: |-
                      TokenFile authenticates with a JWT read from a file in the provider
                      container, for example a projected service account token.
                    properties:
                      audience:
                        description: |-
                          Audience the token must carry in its aud claim, for example the audience
                          of the projected volume ("clickhouse"). Checked before the token is
                          sent.
                        minLength: 1
                        type: string
                      path:
                        description: |-
                          Path is an absolute path inside the provider container, for example a
                          projected service account token mounted through a
                          DeploymentRuntimeConfig. The file is re-read on every new connection.
                          Paths under /var/run/secrets/kubernetes.io/serviceaccount/ are refused:
                          that is the provider's own Kubernetes API credential.
                        pattern: ^/
                        type: string
                    required:
                    - audience
                    - path
                    type: object
                  tokenSecret:
                    description: TokenSecret authenticates with a JWT stored in a
                      Secret.
                    properties:
                      audience:
                        description: |-
                          Audience the token must carry in its aud claim. Checked before the token
                          is sent.
                        minLength: 1
                        type: string
                      secretRef:
                        description: |-
                          SecretRef selects the Secret key that holds a JWT. It is re-read
                          (uncached) on every new connection.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - audience
                    - secretRef
                    type: object
                required:
                - source
                type: object
                x-kubernetes-validations:
                - message: set exactly the block that matches source
                  rule: (self.source == 'PasswordSecret') == has(self.passwordSecret)
                    && (self.source == 'TokenSecret') == has(self.tokenSecret) &&
                    (self.source == 'GoogleIDToken') == has(self.googleIDToken) &&
                    (self.source == 'TokenFile') == has(self.tokenFile)
              defaultDatabase:
                default: default
                description: DefaultDatabase is the database selected for the provider's
                  session.
                type: string
              endpoint:
                description: Endpoint of the ClickHouse server.
                properties:
                  host:
                    description: Host name or IP address.
                    minLength: 1
                    type: string
                  port:
                    description: Port. Defaults to 9000, or 9440 with TLS.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                type: object
              policy:
                description: |-
                  Policy limits what managed resources may do through this config.
                  Required. Write {unrestricted: true} for a single-tenant install.
                properties:
                  allowAdminOption:
                    description: AllowAdminOption lets RoleGrant set adminOption,
                      with the same caveat.
                    type: boolean
                  allowAdoption:
                    description: |-
                      AllowAdoption lets MRs take over pre-existing objects with the
                      clickhouse.m.infrabay.io/adopt annotation.
                    type: boolean
                  allowGlobalGrants:
                    description: AllowGlobalGrants lets Grant use database "*" (ON
                      *.*).
                    type: boolean
                  allowGrantOption:
                    description: |-
                      AllowGrantOption lets Grant set withGrantOption. A grantee holding a
                      grant option can grant and revoke outside the provider.
                    type: boolean
                  allowedAuthentication:
                    description: AllowedAuthentication lists the authentication methods
                      User may use.
                    items:
                      description: AuthenticationMethod of a managed User.
                      enum:
                      - Password
                      - JWT
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  allowedJWTProcessors:
                    description: |-
                      AllowedJWTProcessors lists the exact token processor names that jwt
                      Users may pin. The server accepts unknown processors at DDL time, and
                      those users then cannot log in.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  allowedNamespaces:
                    description: |-
                      AllowedNamespaces lists the namespaces whose MRs may use this
                      ClusterProviderConfig. "{namespace}" is not allowed here: it would
                      match every namespace.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-validations:
                    - message: '{namespace} is not allowed in allowedNamespaces'
                      rule: self.all(x, !x.contains('{namespace}'))
                  databaseNamePatterns:
                    description: |-
                      DatabaseNamePatterns lists the names that Database may create, manage or
                      observe, and the databases a Grant may target.
                    items:
                      type: string
                    type: array
                  grantableRoles:
                    description: |-
                      GrantableRoles lists the roles that RoleGrant may grant (memberOf) and
                      that User.defaultRoles may list.
                    items:
                      type: string
                    type: array
                  roleNamePatterns:
                    description: |-
                      RoleNamePatterns lists the names that Role may create, manage or
                      observe. Also applies to role grantees of Grant and RoleGrant.
                    items:
                      type: string
                    type: array
                  unrestricted:
                    description: |-
                      Unrestricted allows every namespace, name, role, authentication method
                      and processor, global grants, grant option and admin option. Meant for
                      single-tenant installs. Adoption still needs allowAdoption.
                    type: boolean
                  userNamePatterns:
                    description: |-
                      UserNamePatterns lists the names that User may create, manage or
                      observe. Also applies to user grantees of Grant and RoleGrant.
                    items:
                      type: string
                    type: array
                  zooKeeperPathPatterns:
                    description: |-
                      ZooKeeperPathPatterns lists the Keeper paths that a Replicated Database
                      may use besides the default "/clickhouse/databases/{uuid}", which is
                      unique per database UUID and always allowed. Any other path is refused:
                      a tenant could otherwise register a replica under another tenant's
                      Replicated database, which stalls that database's DDL and can copy its
                      tables and data. Anchor custom paths to the namespace, for example
                      "/clickhouse/databases/{namespace}/.+". ClickHouse macros such as {uuid}
                      are compared literally.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                type: object
                x-kubernetes-validations:
                - message: unrestricted cannot be combined with restriction lists
                  rule: '!(has(self.unrestricted) && self.unrestricted) || [has(self.allowedNamespaces),
                    has(self.userNamePatterns), has(self.roleNamePatterns), has(self.databaseNamePatterns),
                    has(self.zooKeeperPathPatterns), has(self.grantableRoles), has(self.allowedAuthentication),
                    has(self.allowedJWTProcessors)].all(x, !x)'
              pool:
                description: Pool configures the provider's connection pool.
                properties:
                  connMaxLifetime:
                    default: 30m
                    description: |-
                      ConnMaxLifetime bounds how long a pooled connection is reused. Native
                      connections are authenticated only at handshake, so this also bounds how
                      long a revoked or expired provider token keeps working.
                    type: string
                  maxOpenConns:
                    default: 4
                    description: MaxOpenConns bounds the connections the provider
                      opens to this server.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                type: object
              protocol:
                default: Native
                description: Protocol to use. Only Native is supported in v1alpha1.
                enum:
                - Native
                type: string
              tls:
                description: TLS configures transport encryption.
                properties:
                  caCertSecretRef:
                    description: CACertSecretRef selects a CA bundle (PEM). Defaults
                      to the system roots.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  enabled:
                    default: false
                    description: Enabled turns on TLS. Required unless allowInsecureTransport
                      is true.
                    type: boolean
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify disables certificate verification. Not allowed with
                      token credentials. Discouraged with passwords: the password then travels
                      to an unauthenticated peer. Use caCertSecretRef instead.
                    type: boolean
                  serverName:
                    description: ServerName overrides the name used for SNI and certificate
                      checks.
                    type: string
                required:
                - enabled
                type: object
            required:
            - credentials
            - endpoint
            - policy
            type: object
            x-kubernetes-validations:
            - message: 'tls.enabled must be true unless allowInsecureTransport is
                true: the native protocol sends the password or token in clear text'
              rule: (has(self.tls) && self.tls.enabled) || (has(self.allowInsecureTransport)
                && self.allowInsecureTransport)
            - message: insecureSkipVerify is not allowed with token credentials
              rule: self.credentials.source == 'PasswordSecret' || !has(self.tls)
                || !has(self.tls.insecureSkipVerify) || !self.tls.insecureSkipVerify
          status:
            description: A ProviderConfigStatus is the status of a ProviderConfig.
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              users:
                description: Users of this provider configuration.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
