---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: grants.clickhouse.m.infrabay.io
spec:
  group: clickhouse.m.infrabay.io
  names:
    categories:
    - crossplane
    - managed
    - clickhouse
    kind: Grant
    listKind: GrantList
    plural: grants
    shortNames:
    - chgrant
    singular: grant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.grantee
      name: GRANTEE
      type: string
    - jsonPath: .status.atProvider.target
      name: TARGET
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Grant grants privileges on one target to one user or role.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A GrantSpec defines the desired state of a Grant.
            properties:
              forProvider:
                description: |-
                  GrantParameters are the configurable fields of a Grant. A Grant owns one
                  exact target (*.*, db.*, db.table or db.table(columns)) for one grantee.
                properties:
                  columns:
                    description: Columns. Only valid with a specific table and column-level
                      privileges.
                    items:
                      maxLength: 255
                      pattern: ^[^\x00-\x1F\x7F]+$
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  database:
                    description: |-
                      Database name, or "*" for a global grant (ON *.*, which needs
                      policy.allowGlobalGrants on a ClusterProviderConfig). Wildcard targets
                      such as "team_*" are not supported in v1alpha1. A '*' inside a name is
                      quoted and therefore literal.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  databaseRef:
                    description: |-
                      DatabaseRef references a Database MR in the same namespace. A namespace, if
                      set, must be this resource's own: a resolved selector writes it, and any
                      other namespace is refused before anything is read.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  databaseSelector:
                    description: DatabaseSelector selects a Database MR in the same
                      namespace.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  privileges:
                    description: |-
                      Privileges, case-insensitive. Names and aliases from system.privileges
                      are accepted, e.g. SELECT, INSERT, "ALTER UPDATE", dictGet, ALL. Source
                      privileges (S3, URL, REMOTE, FILE, ..., READ, WRITE, SOURCES) and
                      privileges of the levels NAMED_COLLECTION, USER_NAME, TABLE_ENGINE,
                      DEFINER and SOURCE are rejected in v1alpha1.
                    items:
                      maxLength: 64
                      pattern: ^[A-Za-z][A-Za-z0-9_ ]*$
                      type: string
                    maxItems: 128
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  role:
                    description: |-
                      Role grantee. No user with the same name may exist: the server resolves
                      grantee names user-first (AmbiguousGrantee).
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  roleRef:
                    description: |-
                      RoleRef references a Role MR in the same namespace. A namespace, if
                      set, must be this resource's own: a resolved selector writes it, and any
                      other namespace is refused before anything is read.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  roleSelector:
                    description: RoleSelector selects a Role MR in the same namespace.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  table:
                    description: Table name, or "*" (the default) for all tables.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  user:
                    description: User grantee.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                  userRef:
                    description: |-
                      UserRef references a User MR in the same namespace. A namespace, if
                      set, must be this resource's own: a resolved selector writes it, and any
                      other namespace is refused before anything is read.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  userSelector:
                    description: UserSelector selects a User MR in the same namespace.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  withGrantOption:
                    default: false
                    description: |-
                      WithGrantOption grants the privileges WITH GRANT OPTION. Needs
                      policy.allowGrantOption on a ClusterProviderConfig.
                    type: boolean
                required:
                - privileges
                type: object
                x-kubernetes-validations:
                - message: database is required ("*" for all databases)
                  rule: has(self.database) || has(self.databaseRef) || has(self.databaseSelector)
                - message: 'set exactly one grantee: user(Ref|Selector) or role(Ref|Selector)'
                  rule: '[has(self.user) || has(self.userRef) || has(self.userSelector),
                    has(self.role) || has(self.roleRef) || has(self.roleSelector)].exists_one(x,
                    x)'
                - message: columns require a specific table
                  rule: '!has(self.columns) || (has(self.table) && self.table != ''*'')'
                - message: a specific table requires a specific database
                  rule: '!has(self.table) || self.table == ''*'' || !has(self.database)
                    || self.database != ''*'''
                - message: database is immutable
                  rule: '!has(oldSelf.database) || (has(self.database) && self.database
                    == oldSelf.database)'
                - message: table is immutable
                  rule: has(self.table) == has(oldSelf.table) && (!has(self.table)
                    || self.table == oldSelf.table)
                - message: columns are immutable
                  rule: has(self.columns) == has(oldSelf.columns) && (!has(self.columns)
                    || self.columns == oldSelf.columns)
                - message: user is immutable
                  rule: '!has(oldSelf.user) || (has(self.user) && self.user == oldSelf.user)'
                - message: role is immutable
                  rule: '!has(oldSelf.role) || (has(self.role) && self.role == oldSelf.role)'
                - message: cross-namespace selectors are not allowed
                  rule: '!has(self.databaseSelector) || !has(self.databaseSelector.__namespace__)
                    || self.databaseSelector.__namespace__.size() == 0'
                - message: cross-namespace selectors are not allowed
                  rule: '!has(self.userSelector) || !has(self.userSelector.__namespace__)
                    || self.userSelector.__namespace__.size() == 0'
                - message: cross-namespace selectors are not allowed
                  rule: '!has(self.roleSelector) || !has(self.roleSelector.__namespace__)
                    || self.roleSelector.__namespace__.size() == 0'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A GrantStatus represents the observed state of a Grant.
            properties:
              atProvider:
                description: GrantObservation are the observable fields of a Grant.
                properties:
                  grantee:
                    description: Grantee is "user:<name>" or "role:<name>".
                    type: string
                  privileges:
                    description: |-
                      Privileges stored at exactly this target, in the server's
                      group-compressed form, sorted. Informational only: the compressed form
                      differs between server versions and is never compared.
                    items:
                      type: string
                    type: array
                  target:
                    description: Target rendered, e.g. "*.*", "app.*", "app.events(a,
                      b)".
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
