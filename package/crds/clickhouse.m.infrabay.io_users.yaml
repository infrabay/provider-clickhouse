---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: users.clickhouse.m.infrabay.io
spec:
  group: clickhouse.m.infrabay.io
  names:
    categories:
    - crossplane
    - managed
    - clickhouse
    kind: User
    listKind: UserList
    plural: users
    shortNames:
    - chuser
    singular: user
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .status.atProvider.authTypes
      name: AUTH
      type: string
    - jsonPath: .status.atProvider.storage
      name: STORAGE
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A User is a ClickHouse SQL user with password or JWT authentication.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A UserSpec defines the desired state of a User.
            properties:
              forProvider:
                description: UserParameters are the configurable fields of a User.
                properties:
                  authentication:
                    description: Authentication method of the user.
                    properties:
                      jwt:
                        description: |-
                          JWT authentication. JWT users are supported only on servers that accept
                          IDENTIFIED WITH jwt (Altinity Antalya).
                        properties:
                          claims:
                            description: |-
                              Claims is a JSON object the token must contain. The server matches it as
                              a subset; arrays match by inclusion, e.g. {groups: [ch-analysts]}
                              accepts a token whose groups contain ch-analysts. The provider
                              canonicalizes it (sorted keys, no insignificant whitespace) before
                              sending and comparing.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          processor:
                            description: |-
                              Processor is the name of a token_processors entry. Required: without it
                              the server accepts a token from ANY configured processor whose username
                              claim equals the user name, which allows cross-issuer impersonation.
                            minLength: 1
                            type: string
                        required:
                        - processor
                        type: object
                      password:
                        description: |-
                          Password authentication. The password is stored as a salted SHA-256
                          hash and published only to the connection Secret.
                        properties:
                          generate:
                            description: Generate a random password and publish it
                              in the connection Secret.
                            properties:
                              length:
                                default: 32
                                description: Length in characters, drawn from [A-Za-z0-9]
                                  with crypto/rand.
                                format: int32
                                maximum: 128
                                minimum: 16
                                type: integer
                              rotationToken:
                                description: |-
                                  RotationToken: set or change it to any new value to rotate the password.
                                  The token that was last applied is stored in the connection Secret.
                                maxLength: 63
                                type: string
                            type: object
                          passwordSecretRef:
                            description: |-
                              PasswordSecretRef selects a password from a Secret in the MR's
                              namespace. Changing the Secret's value changes the password.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: set exactly one of passwordSecretRef or generate
                          rule: has(self.passwordSecretRef) != has(self.generate)
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of password or jwt
                      rule: has(self.password) != has(self.jwt)
                  defaultDatabase:
                    description: |-
                      DefaultDatabase is selected when a client does not name one.
                       - nil: not managed (late-initialized);
                       - "": DEFAULT DATABASE NONE;
                       - "db": DEFAULT DATABASE `db`.
                      The server does not check that the database exists; a missing default
                      database makes logins fail, so pair it with a Database MR.
                    type: string
                  defaultRoles:
                    description: |-
                      DefaultRoles selects which granted roles are active at login. nil means
                      not managed (late-initialized). Membership itself is managed with
                      RoleGrant.
                    properties:
                      policy:
                        default: All
                        description: 'Policy: All, None, Listed or AllExcept.'
                        enum:
                        - All
                        - None
                        - Listed
                        - AllExcept
                        type: string
                      roles:
                        description: Roles for Listed and AllExcept.
                        items:
                          maxLength: 255
                          type: string
                        maxItems: 256
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - policy
                    type: object
                    x-kubernetes-validations:
                    - message: roles is required for Listed and AllExcept and forbidden
                        otherwise
                      rule: (self.policy in ['Listed', 'AllExcept']) == (has(self.roles)
                        && size(self.roles) > 0)
                  hostIP:
                    description: |-
                      HostIP lists allowed client addresses (IP or CIDR; mask notation such as
                      10.0.0.0/255.0.0.0 is accepted). With hostNames, this forms the HOST
                      clause. If both are empty the user may connect from ANY host. Hosts are
                      always enforced, never late-initialized. 0.0.0.0/0 or ::/0 together with
                      hostNames is invalid: the server would drop the names. The server
                      stores loopback addresses and prefixes (inside 127.0.0.0/8, ::1, and
                      their IPv4-mapped forms) as HOST LOCAL, which allows every address of
                      the server host; they compare equal to hostNames: [localhost].
                      An IPv4-mapped or IPv4-compatible entry whose first IPv4 byte is 0 but
                      whose IPv4 part is not all zero is invalid: the server prints it
                      without its last 24 bits.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  hostNames:
                    description: |-
                      HostNames lists exact client host names (HOST NAME). Compared
                      case-sensitively, as the server stores them, except localhost: the
                      server stores it in any case as HOST LOCAL.
                    items:
                      maxLength: 255
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  name:
                    description: |-
                      Name in ClickHouse, for example "svc@my-project.iam.gserviceaccount.com".
                      Defaults to the effective external name. Immutable. The provider never
                      splits it on '@' or '.'.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                    x-kubernetes-validations:
                    - message: name is immutable
                      rule: self == oldSelf
                  settingsProfile:
                    description: |-
                      SettingsProfile is an existing settings profile to inherit. The profile
                      must already exist (users.xml profiles or SQL).
                       - nil: not managed (late-initialized);
                       - "": no profile (SETTINGS NONE);
                       - "x": exactly profile x.
                      Setting a profile replaces all per-user settings elements.
                    type: string
                required:
                - authentication
                type: object
                x-kubernetes-validations:
                - message: name cannot be added or removed after creation
                  rule: has(self.name) == has(oldSelf.name)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: password users require writeConnectionSecretToRef
              rule: '!has(self.forProvider.authentication.password) || has(self.writeConnectionSecretToRef)'
            - message: writeConnectionSecretToRef.name is immutable for password users;
                rotate with generate.rotationToken
              rule: '!has(oldSelf.forProvider.authentication.password) || !has(self.forProvider.authentication.password)
                || !has(oldSelf.writeConnectionSecretToRef) || (has(self.writeConnectionSecretToRef)
                && self.writeConnectionSecretToRef.name == oldSelf.writeConnectionSecretToRef.name)'
          status:
            description: A UserStatus represents the observed state of a User.
            properties:
              atProvider:
                description: UserObservation are the observable fields of a User.
                properties:
                  authTypes:
                    description: AuthTypes, e.g. ["jwt"] or ["sha256_password"].
                    items:
                      type: string
                    type: array
                  defaultDatabase:
                    description: DefaultDatabase of the user.
                    type: string
                  defaultRoles:
                    description: DefaultRoles rendered as "ALL", "NONE", "r1, r2"
                      or "ALL EXCEPT r1".
                    type: string
                  hostIP:
                    description: HostIP as stored by the server.
                    items:
                      type: string
                    type: array
                  hostNames:
                    description: HostNames as stored by the server.
                    items:
                      type: string
                    type: array
                  id:
                    description: |-
                      ID is the UUID from system.users.id. Informational; ownership is
                      recorded in annotations.
                    type: string
                  jwtProcessor:
                    description: JWTProcessor parsed from SHOW CREATE USER.
                    type: string
                  settingsProfile:
                    description: SettingsProfile inherited by the user.
                    type: string
                  storage:
                    description: Storage is local_directory, replicated or users_xml.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
