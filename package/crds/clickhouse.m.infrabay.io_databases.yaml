---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: databases.clickhouse.m.infrabay.io
spec:
  group: clickhouse.m.infrabay.io
  names:
    categories:
    - crossplane
    - managed
    - clickhouse
    kind: Database
    listKind: DatabaseList
    plural: databases
    shortNames:
    - chdb
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .status.atProvider.engine
      name: ENGINE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Database is a ClickHouse database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A DatabaseSpec defines the desired state of a Database.
            properties:
              forProvider:
                description: DatabaseParameters are the configurable fields of a Database.
                properties:
                  comment:
                    description: |-
                      Comment. An empty string clears the comment. Changing it needs
                      ALTER DATABASE ... MODIFY COMMENT, which upstream 25.3 lacks: there a
                      change is reported as Unsupported.
                    type: string
                  engine:
                    description: |-
                      Engine. Immutable. When omitted, the ENGINE clause is omitted, the server
                      default (Atomic) is used, and the engine is late-initialized.
                    properties:
                      name:
                        description: Name of the engine.
                        enum:
                        - Atomic
                        - Replicated
                        type: string
                      replicated:
                        description: Replicated holds the arguments of the Replicated
                          engine.
                        properties:
                          replicaName:
                            default: '{replica}'
                            description: ReplicaName is the replica name.
                            type: string
                          shardName:
                            default: '{shard}'
                            description: ShardName is the shard name.
                            type: string
                          zooKeeperPath:
                            default: /clickhouse/databases/{uuid}
                            description: |-
                              ZooKeeperPath is the Keeper path of the database. On a
                              ClusterProviderConfig that is not unrestricted, only the default and
                              paths that match policy.zooKeeperPathPatterns are allowed.
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: engine is immutable
                      rule: self == oldSelf
                    - message: 'replicated is only valid with name: Replicated'
                      rule: self.name == 'Replicated' || !has(self.replicated)
                  forceDrop:
                    description: |-
                      ForceDrop lets Delete drop a database that still has tables, or whose
                      emptiness cannot be verified. With a cluster (spec.cluster on the
                      config), emptiness can never be verified on every host, so Delete
                      always needs forceDrop there. Default false: Delete refuses and the MR
                      stays in deletion until fixed.
                    type: boolean
                  name:
                    description: |-
                      Name in ClickHouse. Defaults to the effective external name. Immutable.
                      The server stores the name in file names, escaped (non-alphanumeric
                      bytes become %XX); the escaped form plus ".sql.tmp" must fit in 255
                      bytes. The provider checks this before creating the database.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^\x00-\x1F\x7F]+$
                    type: string
                    x-kubernetes-validations:
                    - message: name is immutable
                      rule: self == oldSelf
                    - message: '''*'' is not a valid database name'
                      rule: self != '*'
                type: object
                x-kubernetes-validations:
                - message: name cannot be added or removed after creation
                  rule: has(self.name) == has(oldSelf.name)
                - message: engine cannot be removed
                  rule: '!has(oldSelf.engine) || has(self.engine)'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A DatabaseStatus represents the observed state of a Database.
            properties:
              atProvider:
                description: DatabaseObservation are the observable fields of a Database.
                properties:
                  comment:
                    description: Comment from system.databases.comment.
                    type: string
                  engine:
                    description: Engine from system.databases.engine.
                    type: string
                  engineFull:
                    description: EngineFull from system.databases.engine_full.
                    type: string
                  id:
                    description: |-
                      ID is the UUID from system.databases.uuid. Informational; ownership is
                      recorded in annotations.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
