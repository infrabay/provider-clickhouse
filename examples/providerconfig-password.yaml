# A namespaced ProviderConfig, owned by the namespace tenant together with its
# credentials. Its Secrets are always read from its own namespace, and it has
# no policy: the server-side grants of the identity bound it. Operators can
# disable namespaced ProviderConfigs (--enable-namespaced-provider-configs) or
# restrict their endpoints (--namespaced-endpoint-pattern).
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-tenant
  namespace: team-a
type: Opaque
stringData:
  password: change-me # gitleaks:allow (placeholder)
---
apiVersion: clickhouse.m.infrabay.io/v1alpha1
kind: ProviderConfig
metadata:
  name: tenant
  namespace: team-a
spec:
  endpoint:
    host: clickhouse.team-a.svc.cluster.local
  tls:
    enabled: true
  credentials:
    source: PasswordSecret
    passwordSecret:
      username: team-a-admin
      passwordSecretRef:
        name: clickhouse-tenant
        key: password
