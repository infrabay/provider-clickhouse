# Mounts a projected service account token with the audience "clickhouse"
# for the TokenFile credentials source. Reference it from the Provider with
# spec.runtimeConfigRef.name: provider-clickhouse.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-clickhouse
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-clickhouse
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              volumeMounts:
                - name: clickhouse-token
                  mountPath: /var/run/secrets/clickhouse
                  readOnly: true
          volumes:
            - name: clickhouse-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: clickhouse
                      expirationSeconds: 3600
                      path: token
