# A single-tenant ClusterProviderConfig on upstream ClickHouse with a password
# identity. The identity is defined in the server's users.d (see
# docs/design.md, Appendix B) with prefix-scoped grants.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-provider
  namespace: crossplane-system
type: Opaque
stringData:
  password: change-me # gitleaks:allow (placeholder)
---
apiVersion: clickhouse.m.infrabay.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: clickhouse-main
spec:
  endpoint:
    host: clickhouse.clickhouse.svc.cluster.local # port defaults to 9440 with TLS
  tls:
    enabled: true
    caCertSecretRef:
      namespace: crossplane-system
      name: clickhouse-ca
      key: ca.crt
  credentials:
    source: PasswordSecret
    passwordSecret:
      username: provider-clickhouse
      passwordSecretRef:
        namespace: crossplane-system
        name: clickhouse-provider
        key: password
  # Single tenant: allow everything except adoption.
  policy:
    unrestricted: true
