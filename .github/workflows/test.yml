name: test

on:
  # release.yml runs this whole workflow against a tagged commit before it
  # builds the release.
  workflow_call:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

# Tool versions, kept current by Renovate (customManagers:githubActionsVersions).
env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.8.0
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1
  # renovate: datasource=github-releases depName=crossplane/cli
  CROSSPLANE_CLI_VERSION: v2.5.0

jobs:
  build:
    name: build & unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: gofmt
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then echo "gofmt needed on:"; echo "$fmt"; exit 1; fi
      - run: go vet ./...
      - run: go build -v ./...
      # Deepcopy, method sets, resolvers and CRDs are committed; they must
      # match the API types.
      - name: generated files are current
        run: |
          make generate
          git diff --exit-code -- apis package || { echo "::error::run make generate and commit the result"; exit 1; }
      - run: go test -race -count=1 ./...
      # Committed files end up in release packages; keep home directories and
      # session scratch paths out of them.
      - name: No workstation paths
        run: |
          if git grep -nE '/Users/[A-Za-z]|/home/[A-Za-z]|/private/tmp/[A-Za-z]'; then
            echo "::error::tracked files contain workstation paths (above)"
            exit 1
          fi

  envtest:
    name: CRD validation (envtest) & examples
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      # CEL rules fail their compile and cost checks only in a real
      # kube-apiserver; every example is applied with a server-side dry run.
      - run: make envtest
      - run: make validate

  lint:
    name: golangci-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags=integration,envtest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  integration:
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream 25.3
            upstream: clickhouse/clickhouse-server:25.3.3.42-alpine
            antalya: ""
          - name: upstream 25.8
            upstream: clickhouse/clickhouse-server:25.8.33.6
            antalya: ""
          - name: upstream 26.8
            upstream: clickhouse/clickhouse-server:26.8.23.6
            antalya: ""
          - name: antalya 26.3
            upstream: ""
            antalya: altinity/clickhouse-server:26.3.13.20001.altinityantalya
          - name: antalya 26.6
            upstream: ""
            antalya: altinity/clickhouse-server:26.6.4.20001.altinityantalya
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: make test-integration
        env:
          XPCH_UPSTREAM_IMAGES: ${{ matrix.upstream }}
          XPCH_ANTALYA_IMAGES: ${{ matrix.antalya }}
        run: |
          # An empty list skips that family in this matrix entry.
          if [ -z "$XPCH_UPSTREAM_IMAGES" ]; then export XPCH_UPSTREAM_IMAGES=none; fi
          if [ -z "$XPCH_ANTALYA_IMAGES" ]; then export XPCH_ANTALYA_IMAGES=none; fi
          make test-integration

  # The real package on kind (design 10.4): Crossplane installs it from a
  # registry inside the cluster, with the oldest Crossplane release that
  # package/crossplane.yaml allows and with the latest one (both pinned in
  # the Makefile). kind runs at the version pinned in the Makefile, through
  # go run; its kubeconfig is a separate file. kubectl and Helm come from
  # make e2e-tools (pinned, sha256-verified), not from the runner image. The
  # tests time out (25m, run.sh) well before the job does, so that go test
  # reports the hang and the diagnostics are written and uploaded.
  e2e:
    name: e2e (Crossplane ${{ matrix.crossplane }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - crossplane: oldest
            target: e2e-oldest
          - crossplane: latest
            target: e2e
    env:
      E2E_KUBE_CONTEXT: kind-xpch-e2e
      E2E_KUBECONFIG: ${{ github.workspace }}/_output/e2e/kind.kubeconfig
      E2E_TEST_TIMEOUT: 25m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: pinned kubectl and Helm
        run: |
          make e2e-tools
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: make e2e-kind-up E2E_KIND_KUBECONFIG="$E2E_KUBECONFIG"
      - run: make ${{ matrix.target }}
      - name: upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.crossplane }}
          path: _output/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: delete the kind cluster
        if: always()
        run: make e2e-kind-down E2E_KIND_KUBECONFIG="$E2E_KUBECONFIG"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: false
      # The organisation action needs a licence; the CLI does not. Fake test
      # secrets carry an inline "gitleaks:allow".
      - run: go run "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}" git --redact --verbose .
