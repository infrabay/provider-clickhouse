name: release

# Publishes the Crossplane package when a semantic-version tag is pushed: the
# test workflow runs against the tagged commit first, then a matrix job builds
# the runtime image and the .xpkg per platform, and the publish job pushes the
# multi-platform package to GHCR, signs it, attests its provenance and creates
# the GitHub release. The publish job runs in the 'release' environment
# (deployment tags v*, required reviewer).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  XPKG_REPO: ghcr.io/infrabay/provider-clickhouse
  # renovate: datasource=github-releases depName=crossplane/cli
  CROSSPLANE_CLI_VERSION: v2.5.0

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Dockerfile only copies the cross-compiled binary: no emulation.
      - name: image and xpkg
        run: make xpkg PLATFORMS=linux/${{ matrix.arch }} VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xpkg-${{ matrix.arch }}
          path: _output/provider-${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write      # GitHub release
      packages: write      # GHCR push
      id-token: write      # keyless signing and provenance
      attestations: write  # build provenance
      artifact-metadata: write  # provenance storage record (org Linked Artifacts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xpkg-*
          path: _output
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Builds the multi-platform index; the tag must be semver.
      - name: push
        id: push
        run: |
          make xpkg-push VERSION="${GITHUB_REF_NAME}"
          digest="$(docker buildx imagetools inspect "${XPKG_REPO}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: cosign sign --yes "${XPKG_REPO}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.XPKG_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.XPKG_REPO }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: _output/provider-clickhouse.spdx.json
          upload-artifact: false
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            _output/provider-amd64.xpkg _output/provider-arm64.xpkg _output/provider-clickhouse.spdx.json
